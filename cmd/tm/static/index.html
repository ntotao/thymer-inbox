<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thymer Inbox Configuration</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            ring: 2px solid var(--primary-color);
        }

        .help-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            min-height: 1.25rem;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Thymer Inbox Setup</h1>
        <form id="configForm">
            <div class="form-group">
                <label for="url">Thymer URL</label>
                <input type="text" id="url" name="url" placeholder="https://thymer.com" required>
            </div>

            <div class="form-group">
                <label for="token">Thymer Token</label>
                <input type="password" id="token" name="token" required>
                <div class="help-text">Your secret token for authentication</div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

            <div class="form-group">
                <label for="github_token">GitHub Token (Optional)</label>
                <input type="password" id="github_token" name="github_token">
            </div>

            <div class="form-group">
                <label for="github_repos">GitHub Repos (Optional)</label>
                <input type="text" id="github_repos" name="github_repos" placeholder="owner/repo1, owner/repo2">
            </div>

            <div class="form-group">
                <label for="readwise_token">Readwise Token (Optional)</label>
                <input type="password" id="readwise_token" name="readwise_token">
            </div>

            <div class="form-group">
                <label for="google_client_id">Google Client ID (Optional)</label>
                <input type="text" id="google_client_id" name="google_client_id">
            </div>

            <div class="form-group">
                <label for="google_client_secret">Google Client Secret (Optional)</label>
                <input type="password" id="google_client_secret" name="google_client_secret">
            </div>

            <button type="submit">Save Configuration</button>
            <div id="status" class="status"></div>
        </form>
    </div>

    <div id="loginModal"
        style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:100;">
        <div style="background:var(--card-bg); padding:2rem; border-radius:12px; width:100%; max-width:400px;">
            <h2 style="margin-top:0;">Login Required</h2>
            <p>Please enter your Thymer Token to continue.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginToken">Thymer Token</label>
                    <input type="password" id="loginToken" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/config';
        let authToken = localStorage.getItem('thymer_token') || '';

        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (authToken) {
                headers['Authorization'] = 'Bearer ' + authToken;
            }
            return headers;
        }

        function showLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function hideLogin() {
            document.getElementById('loginModal').style.display = 'none';
        }

        async function loadConfig() {
            try {
                const res = await fetch(API_URL, { headers: getHeaders() });

                if (res.status === 401) {
                    showLogin();
                    return;
                }

                if (!res.ok) throw new Error(await res.text());

                const data = await res.json();

                // Populate form
                for (const [key, value] of Object.entries(data)) {
                    const el = document.getElementById(key);
                    if (el) {
                        if (key === 'github_repos' && Array.isArray(value)) {
                            el.value = value.join(', ');
                        } else {
                            el.value = value;
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to load config:', err);
                // Don't show error to user immediately, might just be network
            }
        }

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const token = document.getElementById('loginToken').value;
            authToken = token;
            localStorage.setItem('thymer_token', token);
            hideLogin();
            loadConfig(); // Retry
        });

        // Config Save Handler
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Saving...';
            statusEl.className = 'status';

            const formData = new FormData(e.target);
            const data = {};
            for (const [key, value] of formData.entries()) {
                if (key === 'github_repos') {
                    data[key] = value.split(',').map(s => s.trim()).filter(s => s);
                } else {
                    data[key] = value;
                }
            }

            // Update local token if changed
            if (data.token && data.token !== authToken) {
                authToken = data.token;
                localStorage.setItem('thymer_token', authToken);
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(data)
                });

                if (res.status === 401) {
                    showLogin();
                    return;
                }

                if (res.ok) {
                    statusEl.textContent = 'Configuration saved! Restarting server...';
                    statusEl.className = 'status success';
                    // Wait and reload
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    throw new Error(await res.text());
                }
            } catch (err) {
                statusEl.textContent = 'Error: ' + err.message;
                statusEl.className = 'status error';
            }
        });

        // Initial Load
        loadConfig();
    </script>
</body>

</html>
